name: fetch-yamnet
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/fetch-yamnet.yml"
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download YAMNet from TF Hub and verify SHA-256
        run: |
          set -euo pipefail
          mkdir -p yamnet
          base="https://tfhub.dev/google/tfjs-model/yamnet/tfjs/1"
          curl -fsSL --retry 3 -o yamnet/model.json "$base/model.json?tfjs-format=file"
          for i in 1 2 3 4; do
            curl -fsSL --retry 3 -o "yamnet/group1-shard${i}of4.bin" "$base/group1-shard${i}of4.bin?tfjs-format=file"
          done
          cat > yamnet/SHA256SUMS <<"EOF"
          552a4e59884a7fad25dbdbc1bbe75af2a416bca44de12523081d4b55606d59d3  model.json
          2ba509dbfc875e0483e5e3f6935cd9be9f986dd1219796c649422fd337dde4ca  group1-shard1of4.bin
          b789c08119ef33a534475b964c25447586e18328039c06322d4b5337887d1fca  group1-shard2of4.bin
          464a4a19cfb207c81bbd6ba079d2f36402902c07faa8b6d305f438dc0ab74212  group1-shard3of4.bin
          311fcb65f9985e825a9f162b7ef82bdc81a745bff11f90bd7b1eaabbd1f55e6b  group1-shard4of4.bin
          EOF
          (cd yamnet && sha256sum -c SHA256SUMS)
          ls -l yamnet
      - name: Commit the files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yamnet
          cat > "$RUNNER_TEMP/msg.txt" <<"EOF"
          Add YAMNet TF.js model files (SHA-256 verified)

          Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>
          Claude-Session: https://claude.ai/code/session_0128FrkCoP2ixMp8BxFA45SH
          EOF
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -F "$RUNNER_TEMP/msg.txt"
            git push
          fi
